[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "biological-network-database"
version = "6.1.0"
description = "Biological Network Database mit PostgreSQL-Backend, FastAPI-basierter REST-API, Web-Frontend, Multi-Omics-Suche und universeller Kodierung mit SQL-Paarindex"
authors = [
    {name = "Stephan Epp"}
]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.104.1",
    "uvicorn[standard]>=0.24.0",
    "psycopg2-binary>=2.9.9",
    "numpy>=1.26.4",
    "matplotlib>=3.11.0",
    "subgraph @ git+https://github.com/naphets86/subgraph.git@main",
    "python-multipart>=0.0.6",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
]

[project.optional-dependencies]
dev = [
    "pylint",
    "pytest",
    "pytest-cov",
    "pytest-playwright",
    "playwright",
    "requests",
    "coverage",
    "httpx2",
]

[tool.coverage.run]
source = ["src"]
branch = true
omit = [
    "tests/*",
    "venv/*",
    "doc/*",
    "src/experiment_search_workers.py",
    "src/experiment_search_backends.py",
    "src/experiment_search_multiomics.py",
    "src/experiment_search_universal.py",
    "db-populate.py"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "src"]
addopts = "--cov=src --cov-report=html:doc/coverage --cov-report=term-missing"
markers = [
    "db: requires the isolated PostgreSQL test database",
    "unit: unit test",
    "integration: API or component integration test",
    "slow: computationally expensive test",
]

# Experimente (nicht Teil der Testabdeckung), Aufruf aus dem Projektordner:
#   python src/experiment_search_workers.py
#   python src/experiment_search_backends.py
#   python src/experiment_search_multiomics.py
#   python src/experiment_search_universal.py
